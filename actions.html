<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>TradingView - Actions</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background-color: #151518;
  }
  .tradingview-widget-container {
    height: 100%;
    width: 100%;
  }
</style>
</head>
<body>

<!-- TradingView Widget BEGIN -->
<div class="tradingview-widget-container">
  <div class="tradingview-widget-container__widget"></div>
  <div class="tradingview-widget-copyright"><a href="https://www.tradingview.com/markets/" rel="noopener nofollow" target="_blank"><span class="blue-text">World markets</span></a> by TradingView</div>
  <script type="text/javascript" src="https://s3.tradingview.com/external-embedding/embed-widget-symbol-overview.js" async>
  {
  "lineWidth": 2,
  "lineType": 0,
  "chartType": "area",
  "fontColor": "rgb(106, 109, 120)",
  "gridLineColor": "rgba(242, 242, 242, 0.06)",
  "volumeUpColor": "rgba(34, 171, 148, 0.5)",
  "volumeDownColor": "rgba(247, 82, 95, 0.5)",
  "backgroundColor": "#151518",
  "widgetFontColor": "#DBDBDB",
  "upColor": "#22ab94",
  "downColor": "#f7525f",
  "borderUpColor": "#22ab94",
  "borderDownColor": "#f7525f",
  "wickUpColor": "#22ab94",
  "wickDownColor": "#f7525f",
  "colorTheme": "dark",
  "isTransparent": false,
  "locale": "en",
  "chartOnly": false,
  "scalePosition": "right",
  "scaleMode": "Normal",
  "fontFamily": "-apple-system, BlinkMacSystemFont, Trebuchet MS, Roboto, Ubuntu, sans-serif",
  "valuesTracking": "1",
  "changeMode": "price-and-percent",
  "symbols": [
    ["Apple", "NASDAQ:AAPL|1D"],
    ["Google", "NASDAQ:GOOGL|1D"],
    ["Microsoft", "NASDAQ:MSFT|1D"],
    ["NASDAQ:NVDA|1D"],
    ["VIE:MAST|1D"],
    ["NASDAQ:CME|1D"],
    ["NYSE:SPGI|1D"],
    ["NYSE:ORCL|1D"],
    ["EURONEXT:CAP|1D"],
    ["NASDAQ:PLTR|1D"],
    ["EURONEXT:RMS|1D"],
    ["NASDAQ:QCOM|1D"]
  ],
  "dateRanges": [
    "1d|1",
    "1m|30",
    "3m|60",
    "12m|1D",
    "60m|1W",
    "all|1M"
  ],
  "fontSize": "10",
  "headerFontSize": "medium",
  "autosize": true,
  "width": "100%",
  "height": "100%",
  "noTimeScale": false,
  "hideDateRanges": false,
  "hideMarketStatus": false,
  "hideSymbolLogo": false
}
  </script>
</div>
<!-- TradingView Widget END -->

</body>
</html>
